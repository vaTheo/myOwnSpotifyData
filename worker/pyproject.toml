[project]
name = "mix-worker"
version = "0.3.0"
description = "The owner's-computer worker of myOwnSpotifyData: fetches a mix from a link, identifies its tracks, sends the tracklist to the owner's server."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "yt-dlp>=2025.4.30",
  "shazamio==0.9.0",
  "imageio-ffmpeg>=0.6",
]

[project.scripts]
mix-worker = "mix_worker.cli:main"

[dependency-groups]
build = ["pyinstaller>=6.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mix_worker"]
