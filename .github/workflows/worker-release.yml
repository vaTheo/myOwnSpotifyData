name: Worker release

# One executable per system, attached to one GitHub release per worker version
# (specs/002-mix-analysis-worker, research D9). Every push to main that touches
# the worker reads the version in worker/pyproject.toml; when no release
# `worker-v<version>` exists yet, it builds, tests and publishes one (the tag is
# created by the release). Same version again → nothing is built. To ship a
# change: bump the version (pyproject.toml, mix_worker/__init__.py, `uv lock`).
# The same version also ships as the Docker image ghcr.io/vatheo/mix-worker
# (amd64 and arm64, spec 035), and the release carries worker/docker-compose.yml.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker-release.yml', '.github/scripts/write_builtin.py']
  workflow_dispatch:

concurrency:
  group: worker-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      exists: ${{ steps.read.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version and look for its release
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib;print(tomllib.load(open('worker/pyproject.toml','rb'))['project']['version'])")
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' worker/mix_worker/__init__.py)
          if [ "$version" != "$code" ]; then
            echo "::error::pyproject.toml says $version, mix_worker/__init__.py says $code"
            exit 1
          fi
          tag="worker-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already released; nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$tag is new; building it."
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: mix-worker-windows-x64.exe
            built: dist/mix-worker.exe
          - os: ubuntu-22.04
            asset: mix-worker-linux-x86_64
            built: dist/mix-worker
          - os: macos-latest
            asset: mix-worker-macos-arm64
            built: dist/mix-worker
          - os: macos-15-intel
            asset: mix-worker-macos-x86_64
            built: dist/mix-worker
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group build
      - run: uv run python -m unittest discover -s tests -v
      # The server the executable reaches with no setting: the repository
      # secrets SUPABASE_URL and SUPABASE_KEY (public values, the app's own,
      # kept as secrets so the log masks them; never in the code). Written
      # after the tests, which run on the empty builtin.py.
      - name: Write the built-in server
        shell: bash
        env:
          BUILTIN_URL: ${{ secrets.SUPABASE_URL }}
          BUILTIN_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run python ../.github/scripts/write_builtin.py mix_worker/builtin.py
      - run: uv run --frozen --group build pyinstaller mix-worker.spec
      - name: Smoke test the executable
        shell: bash
        run: |
          printf 'SUPABASE_URL=https://example.supabase.co\nSUPABASE_KEY=sb_publishable_smoke\n' > smoke.env
          ./${{ matrix.built }} --version
          ./${{ matrix.built }} --config smoke.env check
          # With no settings file, the built-in server is used.
          ./${{ matrix.built }} --config none.env check | grep -F '(built in)'
          mv ${{ matrix.built }} ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: worker/${{ matrix.asset }}
          if-no-files-found: error

  image:
    # After the executables: a failed build leaves no image and no moved latest.
    needs: [version, build]
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The same built-in server as the executables, so the image works with
      # no settings file. Only in this runner's checkout.
      - name: Write the built-in server
        shell: bash
        env:
          BUILTIN_URL: ${{ secrets.SUPABASE_URL }}
          BUILTIN_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 .github/scripts/write_builtin.py worker/mix_worker/builtin.py
      - name: Read the image version
        id: ver
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: echo "version=${TAG#worker-v}" >> "$GITHUB_OUTPUT"
      # QEMU runs the arm64 image on this amd64 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # buildx loads one platform at a time into the local Docker, so each
      # platform is built and tried on its own before anything is pushed.
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64
          load: true
          tags: mix-worker:smoke
          # One cache scope per platform, so the arm64 build does not overwrite it.
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      # bash here means pipefail: a failing check fails the step even if grep matches.
      - name: Smoke test the amd64 image
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          out=$(docker run --rm mix-worker:smoke --version)
          echo "$out"
          if [ "$out" != "mix-worker $VERSION" ]; then
            echo "::error::the image says '$out', expected 'mix-worker $VERSION'"
            exit 1
          fi
          # No settings file in the container, so the built-in server is used.
          docker run --rm mix-worker:smoke check | grep -F '(built in)'
      - name: Build the arm64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/arm64
          load: true
          tags: mix-worker:smoke-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: Smoke test the arm64 image
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 mix-worker:smoke-arm64 --version
          docker run --rm --platform linux/arm64 mix-worker:smoke-arm64 check | grep -F '(built in)'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both platforms are built from the same caches the tested builds filled
      # above (a cache miss rebuilds that layer).
      - name: Push the image for both platforms
        uses: docker/build-push-action@v6
        with:
          context: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/vatheo/mix-worker:${{ steps.ver.outputs.version }}
            ghcr.io/vatheo/mix-worker:latest
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

  release:
    needs: [version, build, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Only the executables: build-push-action also uploads build records
      # (*.dockerbuild), which download-artifact cannot extract.
      - uses: actions/download-artifact@v4
        with:
          pattern: mix-worker-*
          path: assets
          merge-multiple: true
      - name: Create the release with every executable and the compose file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la assets
          gh release create "$TAG" assets/mix-worker-* worker/docker-compose.yml --target "$GITHUB_SHA" --title "$TAG" --latest \
            --notes-file worker/RELEASE_NOTES.md --generate-notes
